<div class="card">
  <div class="card__header">
    <span>🏬 Shopping Centre Impact Metrics</span>
    <strong class="total">40,824 visits</strong>
  </div>

  <!-- Row -->
  <label class="row">
    <span class="row__label">
      Players per court hour
      <button class="info" aria-label="Source" title="Source: LTA, Playtomic 2024">ℹ️</button>
    </span>
    <span class="row__input">
      <input type="number" inputmode="numeric" value="4" min="1" step="1" />
      <span class="unit">players</span>
    </span>
  </label>

  <label class="row">
    <span class="row__label">
      Additional visitors per player
      <button class="info" aria-label="Source" title="Source: Sport England facility visitor studies 2023">ℹ️</button>
    </span>
    <span class="row__input">
      <input type="number" inputmode="decimal" value="0.5" min="0" step="0.1" />
      <span class="unit">visitors</span>
    </span>
  </label>

  <label class="row">
    <span class="row__label">
      Average dwell time
      <button class="info" aria-label="Source" title="Source: Savills Retail & Leisure Report 2024">ℹ️</button>
    </span>
    <span class="row__input">
      <input type="number" inputmode="numeric" value="120" min="0" step="5" />
      <span class="unit">minutes</span>
    </span>
  </label>

  <label class="row">
    <span class="row__label">
      Secondary spend per visit
      <button class="info" aria-label="Source" title="Source: British Retail Consortium 2024 (leisure visitor avg)">ℹ️</button>
    </span>
    <span class="row__input">
      <span class="currency">£</span>
      <input type="number" inputmode="decimal" value="18" min="0" step="1" />
    </span>
  </label>
</div>
